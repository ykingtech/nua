name: Nua
options:
  bundleIdPrefix: com.ykingtech
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ykingtech.nua
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
targets:
  Nua:
    type: application
    platform: iOS
    sources:
      - path: Nua/App
      - path: Nua/Models
      - path: Nua/Services
      - path: Nua/ViewModels
      - path: Nua/Views
      - path: Nua/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Nua
        EXECUTABLE_NAME: Nua
        MACH_O_TYPE: mh_execute
        WRAPPER_EXTENSION: app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nua/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
