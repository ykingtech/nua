workflows:
  ios-release:
    name: Nua iOS Release
    instance_type: mac_mini_m2
    environment:
      groups:
        - nua-secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ykingtech.nua
      xcode: latest
    integrations:
      app_store_connect: codemagic_app_store_connect
    scripts:
      - name: Set build number
        script: agvtool new-version -all $BUILD_NUMBER
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: app-store-connect fetch-signing-files com.ykingtech.nua --type IOS_APP_STORE --create
      - name: Install signing certificate
        script: keychain add-certificates
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/Nua.xcodeproj"
      - name: Build IPA
        script: xcode-project build-ipa --project "Nua.xcodeproj" --scheme "Nua" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/*.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
